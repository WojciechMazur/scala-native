name: "Unix tests env setup"
description: "Used to setup Unix tests environment"
inputs:
  scala-version:
    description: "Scala version used in the tests"
    required: true
  java-version:
    description: "Java version to use in tests"
    default: "25"
  llvm-version:
    description: "LLVM toolchain version installed from apt.llvm.org, the runner's preinstalled LLVM when empty"
    default: ""
runs:
  using: "composite"
  steps:
    - uses: coursier/cache-action@v8
    - uses: coursier/setup-action@v3
      with:
        jvm: ${{inputs.java-version}}
        apps: sbt

    - name: Calculate binary version
      shell: bash
      run: |
        version=${{ inputs.scala-version }}
        if [[ $version == 2.* ]]; then
          echo "project-version=${version/./_}" >> $GITHUB_ENV
        else 
          echo "project-version=3" >> $GITHUB_ENV
        fi

    # Preinstalled LLVM of the runner image, unless a version is requested
    - name: Resolve LLVM version
      id: llvm
      shell: bash
      run: echo "version=${{ inputs.llvm-version || '18' }}" >> "$GITHUB_OUTPUT"

    - name: Install dependencies
      uses: nick-fields/retry@v4
      with:
        timeout_minutes: 10
        max_attempts: 10
        retry_on: error
        shell: bash
        # The runner image ships clang without lld, needed for LTO
        command: |
          sudo apt-get update
          sudo apt-get install -y libgc-dev ${{ inputs.llvm-version == '' && format('lld-{0}', steps.llvm.outputs.version) || '' }}

    - name: Install LLVM toolchain
      shell: bash
      if: ${{ inputs.llvm-version != '' }}
      run: sudo ./ci-docker/install-llvm.sh ${{ inputs.llvm-version }}

    # Prefer the selected LLVM over /usr/bin/clang (Discover uses LLVM_BIN / PATH)
    - name: Expose LLVM toolchain
      shell: bash
      run: |
        LLVM_TOOLCHAIN="/usr/lib/llvm-${{ steps.llvm.outputs.version }}/bin"
        if [[ -d "$LLVM_TOOLCHAIN" ]]; then
          echo "LLVM_BIN=$LLVM_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "$LLVM_TOOLCHAIN" >> "$GITHUB_PATH"
          echo "Using toolchain: $("$LLVM_TOOLCHAIN/clang" --version | head -1)"
        else
          echo "::warning::No directory $LLVM_TOOLCHAIN; set LLVM_BIN on the step if needed."
        fi

    - uses: ./.github/actions/sbt-warmup
