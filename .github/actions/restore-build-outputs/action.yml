name: "Restore build outputs"
description: "Enabled by repository variable CI_SHARE_BUILD_OUTPUTS=true. Download sbt compilation outputs produced by the gate job of the same run. Best effort: sbt compiles anything missing."
inputs:
  scala-version:
    description: "Scala binary version of the outputs"
    required: true
runs:
  using: "composite"
  steps:
    - name: Download build outputs
      id: download
      if: env.CI_SHARE_BUILD_OUTPUTS == 'true'
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: sbt-out-${{ inputs.scala-version }}
        path: ${{ runner.temp }}/sbt-out
    - name: Unpack build outputs
      if: env.CI_SHARE_BUILD_OUTPUTS == 'true' && steps.download.outcome == 'success'
      continue-on-error: true
      shell: bash
      run: |
        # GNU tar on Windows would treat 'D:' in the archive path as a remote host
        flags=""
        if [[ "$RUNNER_OS" == "Windows" ]]; then flags="--force-local"; fi
        tar $flags -xzf "$RUNNER_TEMP/sbt-out/sbt-out.tgz"
        # sbt rewrites generated sources
        chmod -R u+w target/out
        du -sh target/out/*
