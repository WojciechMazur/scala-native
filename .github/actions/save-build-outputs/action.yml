name: "Save build outputs"
description: "Enabled by repository variable CI_SHARE_BUILD_OUTPUTS=true. Upload sbt compilation outputs (JVM classes, NIR) of the gate for reuse in downstream jobs of the same run"
inputs:
  scala-version:
    description: "Scala binary version of the outputs"
    required: true
runs:
  using: "composite"
  steps:
    - name: Pack build outputs
      if: env.CI_SHARE_BUILD_OUTPUTS == 'true'
      shell: bash
      # Skip platform specific native outputs and machine specific task state.
      # Dereference symlinks into sbt's read-only content store.
      run: |
        tar -czhf "$RUNNER_TEMP/sbt-out.tgz" --ignore-failed-read --mode=u+w \
          --exclude='target/out/value' \
          --exclude='native' --exclude='native-test' --exclude='*.dSYM' \
          --exclude='streams' --exclude='test-reports' \
          target/out
        ls -lh "$RUNNER_TEMP/sbt-out.tgz"
    - name: Upload build outputs
      if: env.CI_SHARE_BUILD_OUTPUTS == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: sbt-out-${{ inputs.scala-version }}
        path: ${{ runner.temp }}/sbt-out.tgz
        retention-days: 1
        compression-level: 0
        if-no-files-found: error
