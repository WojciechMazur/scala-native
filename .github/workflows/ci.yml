name: CI
# Single entry point for all tests. The plan job (scripts/ci/plan.scala) sets
# each platform workflow to off, base or extended (base jobs plus the jobs
# with `if: inputs.extended`). Pull requests run a reduced set of jobs, the
# rest runs nightly on main. `ci-ok` is the only required check.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    tags: ["v0.5.*"]
  schedule:
    # Every day at 2 AM UTC, skipped when nothing was committed since the last run
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: "Set of jobs to run"
        type: choice
        default: nightly
        options: [nightly, pr]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI_SHARE_BUILD_OUTPUTS: ${{ vars.CI_SHARE_BUILD_OUTPUTS }}

jobs:
  plan:
    name: Plan
    if: github.event_name != 'schedule' || github.repository == 'scala-native/scala-native'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      publish: ${{ steps.plan.outputs.publish }}
      toolchain: ${{ steps.plan.outputs.toolchain }}
      linux: ${{ steps.plan.outputs.linux }}
      macos: ${{ steps.plan.outputs.macos }}
      windows: ${{ steps.plan.outputs.windows }}
      apple: ${{ steps.plan.outputs.apple }}
      linux-multiarch: ${{ steps.plan.outputs.linux-multiarch }}
      bsd: ${{ steps.plan.outputs.bsd }}
      termux: ${{ steps.plan.outputs.termux }}
      sbt-plugin: ${{ steps.plan.outputs.sbt-plugin }}
      partests: ${{ steps.plan.outputs.partests }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci
      - uses: coursier/cache-action@v8
      - uses: VirtusLab/scala-cli-setup@v1.19
      - name: Select jobs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          DISPATCH_TIER: ${{ inputs.tier }}
        run: scala-cli run --server=false scripts/ci/plan.scala

  # Lint and documentation, independent from the build
  checks:
    name: Lint and docs
    needs: plan
    if: needs.plan.outputs.tier != 'skip'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # docs use git history for last-updated dates
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Formatting is checked with clang-format 14, not shipped with Ubuntu 24.04
      - name: Install clang-format
        run: pip install clang-format==14.0.6
      - name: Lint
        run: CLANG_FORMAT_PATH="$(command -v clang-format)" ./scripts/check-lint.sh
      - name: Build docs
        run: |
          pip install -r docs/requirements.txt
          cd docs && SPHINXOPTS="-W" make html

  # Stop gate: compiles all sources once per Scala version and runs the minimal
  # native program and test infrastructure. Everything below depends on it and
  # reuses its compilation outputs (sbt-out-<version> artifact).
  gate:
    name: Gate (${{ matrix.scala }})
    needs: plan
    if: needs.plan.outputs.tier != 'skip' && needs.plan.outputs.tier != 'docs'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scala: ["2.12", "2.13", "3"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup-env
        with:
          scala-version: ${{ matrix.scala }}
      - name: Compile all sources and run sandbox
        timeout-minutes: 60
        run: >
          sbt
          "compile-all ${{ matrix.scala }}"
          "sandbox${{ env.project-version }}/run"
          "testInterface${{ env.project-version }}/test"
      - uses: ./.github/actions/save-build-outputs
        with:
          scala-version: ${{ matrix.scala }}
      - name: Test runtime on JVM
        timeout-minutes: 30
        run: sbt "test-runtime-jvm ${{ matrix.scala }}"
      - name: Check binary compatibility
        timeout-minutes: 30
        run: sbt "test-mima ${{ matrix.scala }}"

  # sbt plugins, compiled with the Scala version of their sbt
  gate-sbt-plugin:
    name: Gate sbt ${{ matrix.sbt }} plugin
    needs: plan
    if: needs.plan.outputs.tier != 'skip' && needs.plan.outputs.tier != 'docs'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - sbt: "1.x"
            scala: "2.12"
          - sbt: "2.x"
            scala: "3"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup-env
        with:
          scala-version: ${{ matrix.scala }}
      - name: Compile sbt plugin
        timeout-minutes: 30
        run: sbt "compile-sbt-plugin ${{ matrix.scala }}"

  # JVM half of the runtime tests and the test infrastructure on the remaining
  # OSes. Not a dependency of platform jobs (macOS runner queues are long).
  gate-macos:
    name: Gate macOS
    needs: plan
    if: needs.plan.outputs.tier != 'skip' && needs.plan.outputs.tier != 'docs'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/macos-setup-env
        with:
          scala-version: "3"
      - name: Test runtime on JVM and test interface
        timeout-minutes: 45
        run: sbt "test-runtime-jvm 3" "testInterface3/test"

  gate-windows:
    name: Gate Windows
    needs: plan
    if: needs.plan.outputs.tier != 'skip' && needs.plan.outputs.tier != 'docs'
    runs-on: windows-2022
    steps:
      # Disable autocrlf setting, otherwise scalalib patches might not be possible to apply
      - name: Setup git config
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: ./.github/actions/windows-setup-env
        with:
          scala-version: "3"
      - name: Test runtime on JVM and test interface
        timeout-minutes: 45
        shell: cmd
        run: sbt "test-runtime-jvm 3" "testInterface3/test"

  toolchain:
    name: Toolchain
    needs: [plan, gate, gate-sbt-plugin]
    if: needs.plan.outputs.toolchain != 'off'
    uses: ./.github/workflows/run-tests-toolchain.yml
    with:
      extended: ${{ needs.plan.outputs.toolchain == 'extended' }}

  linux:
    name: Linux
    needs: [plan, gate, gate-sbt-plugin]
    if: needs.plan.outputs.linux != 'off'
    uses: ./.github/workflows/run-tests-linux.yml
    with:
      extended: ${{ needs.plan.outputs.linux == 'extended' }}

  macos:
    name: macOS
    needs: [plan, gate, gate-sbt-plugin]
    if: needs.plan.outputs.macos != 'off'
    uses: ./.github/workflows/run-tests-macos.yml
    with:
      extended: ${{ needs.plan.outputs.macos == 'extended' }}

  windows:
    name: Windows
    needs: [plan, gate, gate-sbt-plugin]
    if: needs.plan.outputs.windows != 'off'
    uses: ./.github/workflows/run-tests-windows.yml
    with:
      extended: ${{ needs.plan.outputs.windows == 'extended' }}

  apple:
    name: Apple
    needs: [plan, gate, gate-sbt-plugin]
    if: needs.plan.outputs.apple != 'off'
    uses: ./.github/workflows/run-tests-apple.yml
    with:
      extended: ${{ needs.plan.outputs.apple == 'extended' }}

  linux-multiarch:
    name: Linux Multiarch
    needs: [plan, gate, gate-sbt-plugin]
    if: needs.plan.outputs.linux-multiarch != 'off'
    uses: ./.github/workflows/run-tests-linux-multiarch.yml

  bsd:
    name: BSD
    needs: [plan, gate, gate-sbt-plugin]
    if: needs.plan.outputs.bsd != 'off'
    uses: ./.github/workflows/run-tests-bsd.yml
    with:
      extended: ${{ needs.plan.outputs.bsd == 'extended' }}

  termux:
    name: Termux
    needs: [plan, gate, gate-sbt-plugin]
    if: needs.plan.outputs.termux != 'off'
    uses: ./.github/workflows/run-tests-termux.yml

  sbt-plugin:
    name: sbt plugin
    needs: [plan, gate, gate-sbt-plugin]
    if: needs.plan.outputs.sbt-plugin != 'off'
    uses: ./.github/workflows/run-tests-sbt-plugin.yml
    with:
      extended: ${{ needs.plan.outputs.sbt-plugin == 'extended' }}

  partests:
    name: Partests
    needs: [plan, gate, gate-sbt-plugin]
    if: needs.plan.outputs.partests != 'off'
    uses: ./.github/workflows/run-tests-partests.yml
    with:
      extended: ${{ needs.plan.outputs.partests == 'extended' }}

  # Nightly snapshot (scheduled, or manual run on main), requires only the gates
  publish-snapshot:
    name: Publish snapshot
    needs: [plan, gate, gate-sbt-plugin]
    if: needs.plan.outputs.publish == 'snapshot'
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    secrets: inherit
    with:
      snapshot: true

  # Release from a tag, requires every job of the release plan (CI OK)
  publish-release:
    name: Publish release
    needs: [plan, ci-ok]
    if: needs.plan.outputs.publish == 'release'
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    secrets: inherit
    with:
      snapshot: false

  # Single required status check. Skipped jobs (filtered by `plan`) count as passed.
  ci-ok:
    name: CI OK
    if: always()
    needs: [plan, checks, gate, gate-sbt-plugin, gate-macos, gate-windows, toolchain, linux, macos, windows, apple, linux-multiarch, bsd, termux, sbt-plugin, partests]
    runs-on: ubuntu-24.04
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "::error::Some of the required jobs failed or were cancelled"
            exit 1
          fi
