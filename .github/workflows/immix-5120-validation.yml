name: GC 5120 focused validation
on:
  push:
    branches: [ci/immix-5120-validation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: immix-5120-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scripted:
    name: Immix and Commix recovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    env:
      SCALANATIVE_GC: commix
      SCALANATIVE_MODE: release-fast
    steps:
      - name: Preserve LF patch files on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Linux environment
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-setup-env
        with:
          scala-version: 3
          java-version: 25
      - name: Windows environment
        id: windows
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-setup-env
        with:
          scala-version: 3
          java-version: 25
      - name: Public allocation regressions (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: >-
          sbt ";set sbtScalaNative.v3 / scriptedBufferLog := false;test-scripted 3 run/gc-concurrent-allocation"
      - name: Public allocation regressions (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          SCALANATIVE_INCLUDE_DIRS: ${{ steps.windows.outputs.vcpkg-dir }}\include
          SCALANATIVE_LIB_DIRS: ${{ steps.windows.outputs.vcpkg-dir }}\lib
        run: >-
          sbt ";set sbtScalaNative.v3 / scriptedBufferLog := false;test-scripted 3 run/gc-concurrent-allocation"
