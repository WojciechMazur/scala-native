# Temporary workflow used to debug iOS simulator specific failures
name: iOS debug
on:
  workflow_dispatch:
  push:
    branches:
      - "claude/ios-**"
    paths:
      - ".github/workflows/ios-debug.yml"
      - "scripts/ci/ios-debug/**"
concurrency:
  group: iOS-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repro:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # macos-busy: host binary executed while the simulator is booted
        target: [simulator, macos, macos-busy]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/macos-setup-env
        with:
          scala-version: 3
          llvm-version: 19
      - name: Boot simulator
        if: matrix.target != 'macos'
        run: |
          UDID=$(xcrun simctl list devices available --json | jq -r '
            [ .devices | to_entries[]
              | select(.key | test("SimRuntime\\.iOS-"))
              | { version: (.key | capture("iOS-(?<v>[0-9-]+)$").v | split("-") | map(tonumber)), devices: .value }
            ] | sort_by(.version) | last | .devices
              | map(select(.name | startswith("iPhone"))) | first | .udid')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "IOS_SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          if [[ "${{ matrix.target }}" == "simulator" ]]; then
            echo "SCALANATIVE_TARGET_TRIPLE=$(uname -m)-apple-ios16.0-simulator" >> "$GITHUB_ENV"
          fi
      - name: Build
        run: |
          cp scripts/ci/ios-debug/ContStress.scala sandbox/src/main/scala/Test.scala
          sbt "sandbox3/nativeLink"
      - name: Run
        timeout-minutes: 15
        run: |
          BIN=$(ls target/out/native0.5/scala-3*/sandbox/sandbox | head -1)
          echo "binary: $BIN"; file "$BIN"
          if [[ "${{ matrix.target }}" == "simulator" ]]; then
            scripts/ci/ios-simulator-run.sh "$PWD/$BIN" > out.log 2>&1 &
          else
            "$BIN" > out.log 2>&1 &
          fi
          for i in $(seq 1 400); do
            sleep 1
            if grep -q "HUNG" out.log; then break; fi
            if grep -q "finished=true" out.log; then break; fi
          done
          cat out.log
          if grep -q "HUNG" out.log; then
            PID=$(pgrep -f "$(basename "$BIN")" | tail -1)
            echo "sampling pid $PID"; ps -p "$PID" -o pid,command || true
            sudo lldb -p "$PID" -batch -o "thread backtrace all" -o "detach" || true
            exit 1
          fi
