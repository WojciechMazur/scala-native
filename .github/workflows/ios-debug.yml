# Temporary workflow used to debug iOS simulator specific failures
name: iOS debug
on:
  workflow_dispatch:
  push:
    branches:
      - "claude/ios-**"
    paths:
      - ".github/workflows/ios-debug.yml"
concurrency:
  group: iOS-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repro:
    runs-on: macos-15
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4]
    env:
      SCALANATIVE_MODE: release-fast
      SCALANATIVE_GC: immix
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/macos-setup-env
        with:
          scala-version: 3
          llvm-version: 19
      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | jq -r '
            [ .devices | to_entries[]
              | select(.key | test("SimRuntime\\.iOS-"))
              | { version: (.key | capture("iOS-(?<v>[0-9-]+)$").v | split("-") | map(tonumber)), devices: .value }
            ] | sort_by(.version) | last | .devices
              | map(select(.name | startswith("iPhone"))) | first | .udid')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "IOS_SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          echo "CROSSCOMPILING_EMULATOR=$GITHUB_WORKSPACE/scripts/ci/ios-simulator-run.sh" >> "$GITHUB_ENV"
          echo "SCALANATIVE_TARGET_TRIPLE=$(uname -m)-apple-ios16.0-simulator" >> "$GITHUB_ENV"
      - name: Build
        run: sbt -J-Xmx5G "tests3/Test/nativeLink"
      - name: Run until crash
        run: |
          for i in 1 2 3 4 5 6; do
            echo "::group::iteration $i"
            if ! sbt -J-Xmx5G "tests3/test" > "run-$i.log" 2>&1; then
              echo "::endgroup::"
              echo "iteration $i failed"
              grep -n -E "signal|Illegal|Failed:|error\]" "run-$i.log" | tail -40
              exit 1
            fi
            tail -5 "run-$i.log"
            echo "::endgroup::"
          done
      - name: Crash reports
        if: failure()
        run: |
          sleep 60
          mkdir -p crash
          cp run-*.log crash/ || true
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -type f -mmin -200 2>/dev/null | tee crash/list.txt
          while read -r f; do cp "$f" crash/ || true; done < crash/list.txt
          cp target/out/native0.5/scala-3*/tests/tests-test crash/ || true
          for f in crash/*.ips; do
            echo "=== $f"
            python3 - "$f" <<'PY'
          import json, sys
          raw = open(sys.argv[1]).read()
          head, _, body = raw.partition("\n")
          print(head)
          d = json.loads(body)
          print(json.dumps(d.get("exception"), indent=1))
          print("termination:", json.dumps(d.get("termination")))
          imgs = d.get("usedImages", [])
          for t in d.get("threads", []):
              if not t.get("triggered"):
                  continue
              ts = t.get("threadState", {})
              print("pc:", ts.get("pc"), "lr:", ts.get("lr"), "sp:", ts.get("sp"), "esr:", ts.get("esr"))
              print("x:", [hex(x.get("value", 0)) for x in ts.get("x", [])])
              for fr in t.get("frames", [])[:40]:
                  img = imgs[fr["imageIndex"]] if fr.get("imageIndex", -1) < len(imgs) else {}
                  print("  ", img.get("name"), hex(fr.get("imageOffset", 0)), fr.get("symbol"), fr.get("symbolLocation"))
          print("instructionByteStream:", json.dumps(d.get("instructionByteStream")))
          PY
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crash-${{ matrix.attempt }}
          path: crash
