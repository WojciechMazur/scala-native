name: Nightly report
# Turns failures of scheduled CI runs into GitHub issues (scripts/ci/nightly-report.scala).
# Switch on and off with the repository variable NIGHTLY_CREATE_ISSUES ('true' enables).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  report:
    name: Report nightly results
    if: >
      github.event.workflow_run.event == 'schedule' &&
      github.repository == 'scala-native/scala-native' &&
      vars.NIGHTLY_CREATE_ISSUES == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci
      - uses: coursier/cache-action@v8
      - uses: VirtusLab/scala-cli-setup@v1.19
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: scala-cli run --server=false scripts/ci/nightly-report.scala
