name: repro-3172
on:
  push:
    branches: [triage/3172-repro-ci]
  workflow_dispatch:

jobs:
  scala-cli:
    name: "SN ${{ matrix.sn }} lto=${{ matrix.lto }} mode=${{ matrix.mode }} gc=${{ matrix.gc }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sn: ["0.4.10", "0.4.17", "0.5.12"]
        lto: [thin, none]
        mode: [debug]
        gc: [immix]
        include:
          - { sn: "0.4.17", lto: thin, mode: debug, gc: commix }
          - { sn: "0.4.17", lto: thin, mode: debug, gc: boehm }
          - { sn: "0.4.17", lto: thin, mode: release-fast, gc: immix }
          - { sn: "0.5.12", lto: thin, mode: debug, gc: commix }
          - { sn: "0.5.12", lto: thin, mode: release-fast, gc: immix }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: VirtusLab/scala-cli-setup@v1
      - name: Deps
        run: sudo apt-get update && sudo apt-get -y install libunwind-dev libgc-dev && clang --version
      - name: Run
        run: |
          scala-cli --power package --server=false .github/repro-3172/Repro.scala -o repro --force \
            --native-version ${{ matrix.sn }} --native-lto ${{ matrix.lto }} \
            --native-mode ${{ matrix.mode }} --native-gc ${{ matrix.gc }}
          ok=0
          for k in 1 2 3; do ./repro 300000 3 || { echo "FAILED rc=$? on try $k"; ok=1; }; done
          exit $ok

  main:
    name: "main sandbox lto=${{ matrix.lto }} gc=${{ matrix.gc }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lto: [thin, full]
        gc: [immix, commix]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: sbt/setup-sbt@v1
      - name: Deps
        run: sudo apt-get update && sudo apt-get -y install libunwind-dev && clang --version
      - name: Prepare sandbox
        run: |
          sed -n '/^import scala.annotation.tailrec/,$p' .github/repro-3172/Repro.scala > sandbox/src/main/scala/Test.scala
          cp sandbox/src/main/scala/Test.scala sandbox/src/main/scala-next/Test.scala
      - name: Run
        run: |
          sbt -Dsbt.color=false \
            'set LocalProject("sandbox2_13") / nativeConfig ~= (_.withLTO(scala.scalanative.build.LTO.${{ matrix.lto }}).withMode(scala.scalanative.build.Mode.debug).withGC(scala.scalanative.build.GC.${{ matrix.gc }}))' \
            'show sandbox2_13/nativeLink' 2>&1 | tee link.log
          bin=$(grep -o '/home/runner[^ ]*sandbox[^ ]*' link.log | tail -1)
          echo "binary: $bin"; ls -la "$bin"
          ok=0
          for k in 1 2 3; do "$bin" 300000 3 || { echo "FAILED rc=$? on try $k"; ok=1; }; done
          exit $ok
