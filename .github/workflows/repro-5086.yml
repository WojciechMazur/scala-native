name: repro-5086
# Temporary: narrows down scala-native#5086 (zio/interop-cats ZStreamSpec SIGSEGV) on Linux.
on:
  push:
    branches: [triage/5086-repro-ci]
  workflow_dispatch:

jobs:
  publish-main:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: sbt/setup-sbt@v1
      - name: Publish this branch locally as 0.5.13-SNAPSHOT
        run: env -u CI sbt -Dsbt.server.forcestart=false "publish-local-dev 3.3.7"
      - uses: actions/upload-artifact@v4
        with:
          name: ivy-sn-main
          path: ~/.ivy2/local/org.scala-native
          retention-days: 3

  driver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: VirtusLab/scala-cli-setup@v1
      - run: scala-cli --power package --server=false --assembly -f -o driver.jar .github/repro-5086
      - uses: actions/upload-artifact@v4
        with: { name: driver, path: driver.jar, retention-days: 3 }

  build-binary:
    needs: publish-main
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: immix-debug-x64, runner: ubuntu-24.04, gc: immix, mode: debug }
          - { variant: immix-debug-arm64, runner: ubuntu-24.04-arm, gc: immix, mode: debug }
          - { variant: commix-debug-x64, runner: ubuntu-24.04, gc: commix, mode: debug }
          - { variant: boehm-debug-x64, runner: ubuntu-24.04, gc: boehm, mode: debug }
          - { variant: none-debug-x64, runner: ubuntu-24.04, gc: none, mode: debug }
          - { variant: immix-release-x64, runner: ubuntu-24.04, gc: immix, mode: releaseFast }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zio/interop-cats
          ref: refs/pull/763/head
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: sbt/setup-sbt@v1
      - if: matrix.gc == 'boehm'
        run: sudo apt-get update && sudo apt-get install -y libgc-dev
      - uses: actions/download-artifact@v4
        with: { name: ivy-sn-main, path: ~/.ivy2/local/org.scala-native }
      - name: Use local Scala Native main
        run: |
          sed -i -E 's/("sbt-scala-native" *% *)"[^"]+"/\1"0.5.13-SNAPSHOT"/' project/plugins.sbt
          cat > native-variant.sbt <<'EOF'
          LocalProject("zioInteropCatsTestsNative") / nativeConfig ~= (_.withGC(scala.scalanative.build.GC.${{ matrix.gc }}).withMode(scala.scalanative.build.Mode.${{ matrix.mode }}))
          EOF
          cat native-variant.sbt
      - run: sbt "++3.3.7 zioInteropCatsTestsNative/Test/nativeLink" | tee link.log
      - run: |
          grep -E "Linking native code|Optimizing" link.log
          mkdir out && cp zio-interop-cats-tests/native/target/scala-3.3.7/zio-interop-cats-tests-test out/test-bin
      - uses: actions/upload-artifact@v4
        with: { name: "bin-${{ matrix.variant }}", path: out, retention-days: 3 }

  campaign:
    needs: [build-binary, driver]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        variant: [immix-debug-x64, commix-debug-x64, boehm-debug-x64, none-debug-x64, immix-release-x64]
        shard: [1, 2, 3, 4]
        runner: [ubuntu-24.04]
        include:
          - { variant: immix-debug-arm64, runner: ubuntu-24.04-arm, shard: 1 }
          - { variant: immix-debug-arm64, runner: ubuntu-24.04-arm, shard: 2 }
          - { variant: immix-debug-arm64, runner: ubuntu-24.04-arm, shard: 3 }
          - { variant: immix-debug-arm64, runner: ubuntu-24.04-arm, shard: 4 }
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - if: startsWith(matrix.variant, 'boehm')
        run: sudo apt-get update && sudo apt-get install -y libgc1
      - uses: actions/download-artifact@v4
        with: { name: "bin-${{ matrix.variant }}", path: bin }
      - uses: actions/download-artifact@v4
        with: { name: driver, path: drv }
      - name: Run ZStreamSpec campaign (3 drivers x 60 fresh processes)
        run: |
          chmod +x bin/test-bin
          nproc; uname -m
          for k in 1 2 3; do
            timeout 40m java -Xmx512m -cp drv/driver.jar Driver "$PWD/bin/test-bin" 60 1 ZStreamSpec > camp-$k.log 2>&1 &
          done
          wait
          {
            echo "### ${{ matrix.variant }} shard ${{ matrix.shard }}"
            grep -h SUMMARY camp-*.log
            grep -h -E "Unhandled signal|ClassCastException|ArrayIndexOutOfBounds|NullPointerException|StackOverflow|OutOfMemory|non-zero value" camp-*.log | cut -c1-200 | sort | uniq -c | sort -rn | head -20
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "logs-${{ matrix.variant }}-${{ matrix.shard }}", path: "camp-*.log", retention-days: 7 }
