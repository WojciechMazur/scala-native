name: repro-5086
# Temporary: narrows down scala-native#5086 (zio/interop-cats ZStreamSpec SIGSEGV, Immix debug, x86_64).
on:
  push:
    branches: [triage/5086-repro-ci]
  workflow_dispatch:

jobs:
  publish-main:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: sbt/setup-sbt@v1
      - name: Publish this branch locally as 0.5.13-SNAPSHOT
        run: env -u CI sbt -Dsbt.server.forcestart=false "publish-local-dev 3.3.7"
      - uses: actions/upload-artifact@v4
        with:
          name: ivy-sn-main
          path: ~/.ivy2/local/org.scala-native
          retention-days: 3

  driver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: VirtusLab/scala-cli-setup@v1
      - run: scala-cli --power package --server=false --assembly -f -o driver.jar .github/repro-5086
      - uses: actions/upload-artifact@v4
        with: { name: driver, path: driver.jar, retention-days: 3 }

  build-binary:
    needs: publish-main
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: immix-debug, config: "_.withGC(scala.scalanative.build.GC.immix)" }
          - { variant: immix-debug-nomt, config: "_.withGC(scala.scalanative.build.GC.immix).withMultithreading(false)" }
          - { variant: immix-debug-asserts, config: "_.withGC(scala.scalanative.build.GC.immix).withCompileOptions((o: Seq[String]) => o :+ \"-DGC_ASSERTIONS\")" }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zio/interop-cats
          ref: refs/pull/763/head
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: sbt/setup-sbt@v1
      - uses: actions/download-artifact@v4
        with: { name: ivy-sn-main, path: ~/.ivy2/local/org.scala-native }
      - name: Use local Scala Native main
        run: |
          sed -i -E 's/("sbt-scala-native" *% *)"[^"]+"/\1"0.5.13-SNAPSHOT"/' project/plugins.sbt
          echo 'LocalProject("zioInteropCatsTestsNative") / nativeConfig ~= (${{ matrix.config }})' > native-variant.sbt
          cat native-variant.sbt
      - run: sbt "++3.3.7 zioInteropCatsTestsNative/Test/nativeLink" | tee link.log
      - run: |
          grep -E "Linking native code|Optimizing|multithreading" link.log
          mkdir out && cp zio-interop-cats-tests/native/target/scala-3.3.7/zio-interop-cats-tests-test out/test-bin
      - uses: actions/upload-artifact@v4
        with: { name: "bin-${{ matrix.variant }}", path: out, retention-days: 3 }

  campaign:
    needs: [build-binary, driver]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: base-1, variant: immix-debug, env: "" }
          - { name: base-2, variant: immix-debug, env: "" }
          - { name: base-3, variant: immix-debug, env: "" }
          - { name: base-4, variant: immix-debug, env: "" }
          - { name: heap1m-1, variant: immix-debug, env: "GC_INITIAL_HEAP_SIZE=1M" }
          - { name: heap1m-2, variant: immix-debug, env: "GC_INITIAL_HEAP_SIZE=1M" }
          - { name: heap64m-1, variant: immix-debug, env: "GC_INITIAL_HEAP_SIZE=64M" }
          - { name: heap64m-2, variant: immix-debug, env: "GC_INITIAL_HEAP_SIZE=64M" }
          - { name: nomt-1, variant: immix-debug-nomt, env: "" }
          - { name: nomt-2, variant: immix-debug-nomt, env: "" }
          - { name: asserts-1, variant: immix-debug-asserts, env: "" }
          - { name: asserts-2, variant: immix-debug-asserts, env: "" }
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gdb > /dev/null
      - uses: actions/download-artifact@v4
        with: { name: "bin-${{ matrix.variant }}", path: bin }
      - uses: actions/download-artifact@v4
        with: { name: driver, path: drv }
      - name: Run ZStreamSpec campaign (3 drivers x 60 fresh processes)
        run: |
          chmod +x bin/test-bin
          mkdir -p cores && sudo sysctl -w kernel.core_pattern="$PWD/cores/core.%p" && ulimit -c unlimited
          for k in 1 2 3; do
            timeout 40m java -Xmx512m -cp drv/driver.jar Driver "$PWD/bin/test-bin" 60 1 ZStreamSpec ${{ matrix.env }} > camp-$k.log 2>&1 &
          done
          wait
          {
            echo "### ${{ matrix.name }} (${{ matrix.variant }} ${{ matrix.env }})"
            grep -h SUMMARY camp-*.log
            grep -h -E "Unhandled signal|ClassCastException|ArrayIndexOutOfBounds|NullPointerException|StackOverflow|OutOfMemory|Assertion|assert|non-zero value" camp-*.log | cut -c1-200 | sort | uniq -c | sort -rn | head -20
            echo "cores: $(ls cores | wc -l)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Analyze cores
        if: always()
        run: |
          n=0
          for c in cores/core.*; do
            [ -f "$c" ] || continue
            n=$((n+1)); [ $n -gt 4 ] && break
            echo "===== $c" >> gdb.txt
            gdb -q -batch bin/test-bin "$c" \
              -ex "info threads" -ex "bt 25" -ex "info registers" -ex "x/24i \$pc-64" \
              -ex "x/16gx \$sp" -ex "thread apply all bt 6" >> gdb.txt 2>&1 || true
          done
          ls -la cores | head
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "logs-${{ matrix.name }}", path: "camp-*.log\ngdb.txt", retention-days: 7 }
