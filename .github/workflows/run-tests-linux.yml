name: Run tests Linux
# Called from ci.yml, inputs are computed by its plan job (scripts/ci/plan.scala).
on:
  workflow_call:
    inputs:
      nightly: { type: boolean, default: false }
      gc: { type: boolean, default: false }
      sbt-plugin: { type: boolean, default: false }
      partest: { type: boolean, default: false }
      partest-full: { type: boolean, default: false }

permissions:
  contents: read

env:
  CI_SHARE_BUILD_OUTPUTS: ${{ vars.CI_SHARE_BUILD_OUTPUTS }}
  SCALANATIVE_TEST_PREFETCH_DEBUG_INFO: 1

jobs:
  # Every GC with sandbox, test interface and JUnit outputs
  test-gc:
    name: Test GC (${{ matrix.mode }}, lto=${{ matrix.lto }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - mode: release-fast
            lto: thin
    steps: &test-gc-steps
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup-env
        with:
          scala-version: "3"
      - uses: ./.github/actions/restore-build-outputs
        with:
          scala-version: "3"
      - name: Test GC
        timeout-minutes: 45
        env:
          SCALANATIVE_MODE: ${{ matrix.mode }}
          SCALANATIVE_LTO: ${{ matrix.lto }}
        run: sbt "test-gc 3"

  test-gc-nightly:
    name: Test GC (${{ matrix.mode }}, lto=${{ matrix.lto }})
    if: inputs.nightly
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - mode: debug
            lto: none
    steps: *test-gc-steps

  # Native runtime tests (the JVM part runs in the gate)
  runtime:
    name: Runtime ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64 (3)
            os: ubuntu-24.04
            scala: "3"
            mode: release-fast
            optimize: true
          - name: arm64 (3)
            os: ubuntu-24.04-arm
            scala: "3"
            mode: release-fast
            optimize: true
          - name: no-opt x64 (3)
            os: ubuntu-24.04
            scala: "3"
            mode: debug
            optimize: false
          - name: x64 (2.13)
            os: ubuntu-24.04
            scala: "2.13"
            mode: release-fast
            optimize: true
          - name: x64 (2.12)
            os: ubuntu-24.04
            scala: "2.12"
            mode: release-fast
            optimize: true
    steps: &runtime-steps
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup-env
        with:
          scala-version: ${{ matrix.scala }}
      - uses: ./.github/actions/restore-build-outputs
        with:
          scala-version: ${{ matrix.scala }}
      - name: Run tests
        timeout-minutes: 60
        env:
          SCALANATIVE_MODE: ${{ matrix.mode }}
          SCALANATIVE_GC: immix
          SCALANATIVE_OPTIMIZE: ${{ matrix.optimize }}
        run: sbt "test-runtime-native ${{ matrix.scala }}"

  runtime-nightly:
    name: Runtime ${{ matrix.name }}
    if: inputs.nightly
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64 debug (3)
            os: ubuntu-24.04
            scala: "3"
            mode: debug
            optimize: true
          - name: x64 debug (2.13)
            os: ubuntu-24.04
            scala: "2.13"
            mode: debug
            optimize: true
          - name: x64 debug (2.12)
            os: ubuntu-24.04
            scala: "2.12"
            mode: debug
            optimize: true
    steps: *runtime-steps

  # GC rows of the runtime extension matrix, on pull requests changing the GC
  runtime-ext-gc:
    name: Runtime extension (3, release-fast, thin, ${{ matrix.gc }})
    if: inputs.gc && !inputs.nightly
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scala: ["3"]
        build-mode: [release-fast]
        lto: [thin]
        gc: [immix, commix, boehm]
    steps: &runtime-ext-steps
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup-env
        with:
          scala-version: ${{ matrix.scala }}
      - uses: ./.github/actions/restore-build-outputs
        with:
          scala-version: ${{ matrix.scala }}
      - name: Run tests
        timeout-minutes: 60
        env:
          SCALANATIVE_MODE: ${{ matrix.build-mode }}
          SCALANATIVE_GC: ${{ matrix.gc }}
          SCALANATIVE_LTO: ${{ matrix.lto }}
          SCALANATIVE_OPTIMIZE: true
        run: sbt "test-runtime-native ${{ matrix.scala }}"

  runtime-ext:
    name: Runtime extension
    if: inputs.nightly
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scala: ["2.13", "3"]
        build-mode: [debug, release-fast]
        lto: [none, thin]
        gc: [boehm, immix, commix]
        exclude:
          # Covered by runtime-nightly
          - scala: "3"
            build-mode: debug
          - scala: "2.13"
            build-mode: debug
            gc: immix
          # Slow, leads to timeouts
          - build-mode: release-fast
            lto: none
        include:
          - scala: "3"
            build-mode: release-size
            lto: thin
            gc: immix
    steps: *runtime-ext-steps

  llvm-versions:
    name: LLVM ${{ matrix.llvm }}
    if: inputs.nightly
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # apt.llvm.org/llvm.sh accepts LLVM release numbers, not the "latest" alias.
        llvm: [17, 18, 19, 20, 21, 22] # Last 3 stable versions + available future versions
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup-env
        with:
          scala-version: "3"
          llvm-version: ${{ matrix.llvm }}
      - uses: ./.github/actions/restore-build-outputs
        with:
          scala-version: "3"
      - name: Run tests
        timeout-minutes: 60
        env:
          SCALANATIVE_MODE: release-fast
          SCALANATIVE_LTO: thin
        run: sbt "test-runtime-native 3"

  # Scala 3 tests the sbt 2.x plugin
  scripted:
    name: Scripted (${{ matrix.scala }})
    if: inputs.sbt-plugin
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        scala: ["3"]
    steps: &scripted-steps
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup-env
        with:
          scala-version: ${{ matrix.scala }}
      - name: Run tests
        timeout-minutes: 90
        env:
          SCALANATIVE_MODE: release-fast
          SCALANATIVE_GC: immix
          SCALANATIVE_OPTIMIZE: true
        run: sbt "test-scripted ${{ matrix.scala }}"

  # Scala 2.12 tests the sbt 1.x plugin
  scripted-sbt1:
    name: Scripted (${{ matrix.scala }})
    if: inputs.nightly
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        scala: ["2.12"]
    steps: *scripted-steps

  partests:
    name: Partests (2.13)
    if: inputs.partest || inputs.partest-full
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup-env
        with:
          scala-version: "2.13"

      # Make sure that Scala partest denylisted tests contain only valid test names
      - name: Setup Scala-cli
        uses: VirtusLab/scala-cli-setup@v1.19
      - name: Check partest disabled tests list
        run: |
          sbt "scalaPartest2_13/fetchScalaSource"
          scala-cli scripts/partest-check-files.scala

      # scala-cli-setup can override default java version
      - uses: ./.github/actions/linux-setup-env
        with:
          scala-version: "2.13"

      # Running all partests takes ~4h, without full run check a single test of each kind
      - name: Test partests infrastructure
        if: ${{ !inputs.partest-full }}
        timeout-minutes: 45
        run: >
          sbt "-J-Xmx3G"
          "scalaPartestTests2_13/testOnly -- --showDiff neg/abstract.scala pos/abstract.scala run/Course-2002-01.scala"

      - name: Run all of partests
        if: inputs.partest-full
        timeout-minutes: 300
        run: sbt "-J-Xmx3G" "scalaPartestTests2_13/testOnly -- --showDiff"
