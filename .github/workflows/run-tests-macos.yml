name: Run tests MacOs
# Repro-only workflow for macOS hangs (#4/#7) and arm64 SIGILL (#6).
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: macOS-${{ github.head_ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  ENABLE_EXPERIMENTAL_COMPILER: true
  SCALANATIVE_OPTIMIZE: true
  SCALANATIVE_TEST_PREFETCH_DEBUG_INFO: 1
  SCALANATIVE_TEST_DEBUG_SIGNALS: 1
  HANG_WATCHDOG_KILL: 1
  HANG_WATCHDOG_LLDB: 1

jobs:
  repro:
    name: ${{ matrix.issue }} (${{ matrix.scala }}, ${{ matrix.build-mode }}, ${{ matrix.lto }}, ${{ matrix.gc }}, llvm ${{ matrix.llvm }}) ${{ matrix.variant }} [${{ matrix.attempt }}]
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          # #4 fix verification
          - { issue: hang4, scala: 3, build-mode: release-fast, lto: none, gc: boehm, llvm: 19, attempt: 1, iterations: 8, variant: alone,
              first: "show junitTestOutputsNative3/nativeConfig; junitTestOutputsNative3/test", repeated: "junitTestOutputsNative3/testFull; junitTestOutputsNative3/testFull; junitTestOutputsNative3/testFull" }
          - { issue: hang4, scala: 3, build-mode: release-fast, lto: none, gc: boehm, llvm: 19, attempt: 2, iterations: 8, variant: alone,
              first: "show junitTestOutputsNative3/nativeConfig; junitTestOutputsNative3/test", repeated: "junitTestOutputsNative3/testFull; junitTestOutputsNative3/testFull; junitTestOutputsNative3/testFull" }
          - { issue: hang4, scala: 3, build-mode: release-fast, lto: thin, gc: boehm, llvm: 19, attempt: 1, iterations: 8, variant: alone,
              first: "show junitTestOutputsNative3/nativeConfig; junitTestOutputsNative3/test", repeated: "junitTestOutputsNative3/testFull; junitTestOutputsNative3/testFull; junitTestOutputsNative3/testFull" }
          - { issue: hang4, scala: 3, build-mode: release-fast, lto: none, gc: boehm, llvm: 19, attempt: 1, iterations: 6, variant: after-tests,
              first: "show tests3/nativeConfig; tests3/test; junitTestOutputsNative3/test", repeated: "junitTestOutputsNative3/testFull; junitTestOutputsNative3/testFull; junitTestOutputsNative3/testFull" }
          - { issue: hang7, scala: 2.13, build-mode: release-fast, lto: thin, gc: boehm, llvm: 19, attempt: 1, iterations: 6,
              first: "show tests2_13/nativeConfig; tests2_13/test", repeated: "tests2_13/testFull" }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/macos-setup-env
        with:
          scala-version: ${{ matrix.scala }}
          gc: ${{ matrix.gc }}
          llvm-version: ${{ matrix.llvm }}

      - name: Run repro loop
        timeout-minutes: 300
        env:
          SCALANATIVE_MODE: ${{ matrix.build-mode }}
          SCALANATIVE_GC: ${{ matrix.gc }}
          SCALANATIVE_LTO: ${{ matrix.lto }}
        run: |
          scripts/ci/hang-watchdog.sh "$RUNNER_TEMP/hang-dumps" 900 17400 &
          scripts/ci/repro-loop.sh ${{ matrix.iterations }} "${{ matrix.first }}" "${{ matrix.repeated }}"

      - name: Upload hang diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hang-dumps-${{ matrix.issue }}-${{ matrix.scala }}-${{ matrix.build-mode }}-${{ matrix.lto }}-${{ matrix.gc }}-${{ matrix.llvm }}-${{ matrix.variant }}-${{ matrix.attempt }}
          path: ${{ runner.temp }}/hang-dumps
          if-no-files-found: ignore

      - uses: ./.github/actions/macos-upload-crash-reports
        if: always()
        with:
          name: ${{ matrix.issue }}-${{ matrix.scala }}-${{ matrix.build-mode }}-${{ matrix.lto }}-${{ matrix.gc }}-${{ matrix.llvm }}-${{ matrix.variant }}-${{ matrix.attempt }}
