name: Run tests MacOs
# Called from ci.yml, inputs are computed by its plan job (scripts/ci/plan.scala).
# Apple embedded targets (iOS, tvOS, watchOS) are tested in run-tests-apple.yml
on:
  workflow_call:
    inputs:
      nightly: { type: boolean, default: false }
      native-runtime: { type: boolean, default: false }
      sbt-plugin: { type: boolean, default: false }

permissions:
  contents: read

env:
  CI_SHARE_BUILD_OUTPUTS: ${{ vars.CI_SHARE_BUILD_OUTPUTS }}
  SCALANATIVE_TEST_PREFETCH_DEBUG_INFO: 1

jobs:
  # Every GC with sandbox, test interface and JUnit outputs
  test-gc:
    name: Test GC (${{ matrix.mode }}, lto=${{ matrix.lto }})
    if: inputs.native-runtime
    runs-on: macos-15
    strategy:
      matrix:
        include:
          - mode: release-fast
            lto: thin
    steps: &test-gc-steps
      - uses: actions/checkout@v7
      - uses: ./.github/actions/macos-setup-env
        with:
          scala-version: "3"
          gc: boehm
          llvm-version: 19
      - uses: ./.github/actions/restore-build-outputs
        with:
          scala-version: "3"
      - name: Test GC
        timeout-minutes: 45
        env:
          SCALANATIVE_MODE: ${{ matrix.mode }}
          SCALANATIVE_LTO: ${{ matrix.lto }}
        run: sbt "test-gc 3"

  test-gc-nightly:
    name: Test GC (${{ matrix.mode }}, lto=${{ matrix.lto }})
    if: inputs.nightly
    runs-on: macos-15
    strategy:
      matrix:
        include:
          - mode: debug
            lto: none
    steps: *test-gc-steps

  # Native runtime tests (the JVM part runs in the gate)
  runtime:
    name: Runtime arm64 (${{ matrix.scala }}, ${{ matrix.mode }})
    runs-on: macos-15
    strategy:
      matrix:
        include:
          - scala: "3"
            mode: release-fast
    steps: &runtime-steps
      - uses: actions/checkout@v7
      - uses: ./.github/actions/macos-setup-env
        with:
          scala-version: ${{ matrix.scala }}
      - uses: ./.github/actions/restore-build-outputs
        with:
          scala-version: ${{ matrix.scala }}
      - name: Run tests
        timeout-minutes: 60
        env:
          SCALANATIVE_MODE: ${{ matrix.mode }}
        run: sbt "test-runtime-native ${{ matrix.scala }}"

  runtime-nightly:
    name: Runtime arm64 (${{ matrix.scala }}, ${{ matrix.mode }})
    if: inputs.nightly
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - scala: "3"
            mode: debug
          - scala: "2.13"
            mode: debug
          - scala: "2.12"
            mode: debug
    steps: *runtime-steps

  runtime-ext:
    name: Runtime extension
    if: inputs.nightly
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        scala: ["2.13", "3"]
        build-mode: [debug, release-fast]
        lto: [none, thin]
        gc: [boehm, immix, commix]
        exclude:
          # Covered by runtime-nightly
          - scala: "3"
            build-mode: debug
          - lto: thin
            build-mode: debug
        include:
          - scala: "3"
            build-mode: release-size
            lto: thin
            gc: immix
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/macos-setup-env
        with:
          scala-version: ${{ matrix.scala }}
          gc: ${{ matrix.gc }}
          llvm-version: 19
      - uses: ./.github/actions/restore-build-outputs
        with:
          scala-version: ${{ matrix.scala }}
      - name: Run tests
        timeout-minutes: 60
        env:
          SCALANATIVE_MODE: ${{ matrix.build-mode }}
          SCALANATIVE_GC: ${{ matrix.gc }}
          SCALANATIVE_LTO: ${{ matrix.lto }}
          SCALANATIVE_OPTIMIZE: true
          # testsExt is not part of the macOS extension matrix
          TEST_COMMAND: >
            show tests${{ env.project-version }}/nativeConfig;
            sandbox${{ env.project-version }}/run;
            tests${{ env.project-version }}/test;
            junitTestOutputsNative${{ env.project-version }}/test;
            scalaPartestJunitTests${{ env.project-version }}/test
        run: sbt -J-Xmx5G "${TEST_COMMAND}"

  llvm-versions:
    name: LLVM ${{ matrix.llvm }}
    if: inputs.nightly
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        llvm: [17, 18, 19, 20, 21, latest] # Latest version == 22
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/macos-setup-env
        with:
          scala-version: "3"
          llvm-version: ${{ matrix.llvm }}
      - uses: ./.github/actions/restore-build-outputs
        with:
          scala-version: "3"
      - name: Run tests
        timeout-minutes: 60
        run: sbt "test-runtime-native 3"

  # Scala 3 tests the sbt 2.x plugin
  scripted:
    name: Scripted (${{ matrix.scala }})
    if: inputs.sbt-plugin
    runs-on: macos-15
    strategy:
      matrix:
        scala: ["3"]
    steps: &scripted-steps
      - uses: actions/checkout@v7
      - uses: ./.github/actions/macos-setup-env
        with:
          scala-version: ${{ matrix.scala }}
          llvm-version: latest
          gc: boehm
      - name: Test scripted
        timeout-minutes: 120
        run: sbt "test-scripted ${{ matrix.scala }}"

  # Scala 2.12 tests the sbt 1.x plugin
  scripted-sbt1:
    name: Scripted (${{ matrix.scala }})
    if: inputs.nightly
    runs-on: macos-15
    strategy:
      matrix:
        scala: ["2.12"]
    steps: *scripted-steps
