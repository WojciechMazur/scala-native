name: Run tests sbt plugin
# sbt plugin scripted tests. Called from ci.yml, see scripts/ci/plan.scala
on:
  workflow_call:
    inputs:
      extended: { type: boolean, default: false }

permissions:
  contents: read

jobs:
  # Scala 3 tests the sbt 2.x plugin
  scripted:
    name: Scripted ${{ matrix.os }} (${{ matrix.scala }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: Linux, runner: ubuntu-24.04, scala: "3" }
          - { os: macOS, runner: macos-15, scala: "3" }
          - { os: Windows, runner: windows-2022, scala: "3" }
    steps: &scripted-steps
      # Disable autocrlf setting, otherwise scalalib patches might not be possible to apply
      - name: Setup git config
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup-env
        if: runner.os == 'Linux'
        with:
          scala-version: ${{ matrix.scala }}
      - uses: ./.github/actions/macos-setup-env
        if: runner.os == 'macOS'
        with:
          scala-version: ${{ matrix.scala }}
          llvm-version: latest
          gc: boehm
      - uses: ./.github/actions/windows-setup-env
        if: runner.os == 'Windows'
        with:
          scala-version: ${{ matrix.scala }}
      - name: Test scripted
        if: runner.os != 'Windows'
        timeout-minutes: 120
        env:
          SCALANATIVE_MODE: release-fast
          SCALANATIVE_GC: immix
        run: sbt "test-scripted ${{ matrix.scala }}"
      - name: Test scripted
        if: runner.os == 'Windows'
        timeout-minutes: 120
        # Avoids the boot server's Windows named pipe
        run: sbt --server -Dsbt.server.autostart=false "test-scripted ${{ matrix.scala }}"
        shell: cmd

  # Scala 2.12 tests the sbt 1.x plugin
  scripted-extended:
    name: Scripted ${{ matrix.os }} (${{ matrix.scala }})
    if: inputs.extended
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: Linux, runner: ubuntu-24.04, scala: "2.12" }
          - { os: macOS, runner: macos-15, scala: "2.12" }
          - { os: Windows, runner: windows-2022, scala: "2.12" }
    steps: *scripted-steps
