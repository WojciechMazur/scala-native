name: Run tests Windows
# Called from ci.yml, inputs are computed by its plan job (scripts/ci/plan.scala).
on:
  workflow_call:
    inputs:
      nightly: { type: boolean, default: false }
      native-runtime: { type: boolean, default: false }
      sbt-plugin: { type: boolean, default: false }

permissions:
  contents: read

env:
  CI_SHARE_BUILD_OUTPUTS: ${{ vars.CI_SHARE_BUILD_OUTPUTS }}

jobs:
  # Every GC with sandbox, test interface and JUnit outputs
  test-gc:
    name: Test GC x64 (${{ matrix.mode }}, lto=${{ matrix.lto }})
    if: inputs.native-runtime
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - mode: release-fast
            lto: thin
    steps: &test-gc-steps
      # Disable autocrlf setting, otherwise scalalib patches might not be possible to apply
      - name: Setup git config
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: ./.github/actions/windows-setup-env
        with:
          scala-version: "3"
      - uses: ./.github/actions/restore-build-outputs
        with:
          scala-version: "3"
      - name: Test GC
        timeout-minutes: 45
        env:
          SCALANATIVE_MODE: ${{ matrix.mode }}
          SCALANATIVE_LTO: ${{ matrix.lto }}
        run: sbt "test-gc 3"
        shell: cmd

  test-gc-nightly:
    name: Test GC x64 (${{ matrix.mode }}, lto=${{ matrix.lto }})
    if: inputs.nightly
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - mode: debug
            lto: none
    steps: *test-gc-steps

  # Native runtime tests (the JVM part runs in the gate)
  runtime:
    name: Runtime ${{ matrix.arch }} (${{ matrix.scala }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.arch }}-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-2022
            scala: "3"
            mode: release-fast
          - arch: arm64
            os: windows-11-arm
            scala: "3"
            mode: release-fast
    steps: &runtime-steps
      # Disable autocrlf setting, otherwise scalalib patches might not be possible to apply
      - name: Setup git config
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: ./.github/actions/windows-setup-env
        if: matrix.arch == 'x64'
        with:
          scala-version: ${{ matrix.scala }}
      - uses: ./.github/actions/windows-arm-setup-env
        if: matrix.arch == 'arm64'
        with:
          scala-version: ${{ matrix.scala }}
      - uses: ./.github/actions/restore-build-outputs
        with:
          scala-version: ${{ matrix.scala }}
      - name: Test runtime
        timeout-minutes: 60
        run: >
          set SCALANATIVE_GC=&
          set SCALANATIVE_MODE=${{ matrix.mode }}&
          set SCALANATIVE_TEST_PREFETCH_DEBUG_INFO=1&
          set SCALANATIVE &
          sbt "test-runtime-native ${{ matrix.scala }}"
        shell: cmd

  runtime-nightly:
    name: Runtime ${{ matrix.arch }} (${{ matrix.scala }}, ${{ matrix.mode }})
    if: inputs.nightly
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.arch }}-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-2022
            scala: "3"
            mode: debug
          - arch: arm64
            os: windows-11-arm
            scala: "3"
            mode: debug
          - arch: x64
            os: windows-2022
            scala: "2.13"
            mode: debug
          - arch: x64
            os: windows-2022
            scala: "2.12"
            mode: debug
    steps: *runtime-steps

  runtime-ext:
    name: Runtime extension
    if: inputs.nightly
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        scala: ["2.13", "3"]
        build-mode: [debug, release-fast]
        lto: [none, thin]
        gc: [boehm, immix, commix]
        exclude:
          # Covered by runtime-nightly
          - scala: "3"
            build-mode: debug
          - scala: "2.13"
            build-mode: debug
            gc: immix
          - build-mode: release-fast
            lto: none
        include:
          - scala: "3"
            build-mode: release-size
            lto: thin
            gc: immix
    steps:
      # Disable autocrlf setting, otherwise scalalib patches might not be possible to apply
      - name: Setup git config
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: ./.github/actions/windows-setup-env
        with:
          scala-version: ${{ matrix.scala }}
      - uses: ./.github/actions/restore-build-outputs
        with:
          scala-version: ${{ matrix.scala }}
      - name: Run tests
        timeout-minutes: 60
        run: >
          set SCALANATIVE_GC=${{ matrix.gc }}&
          set SCALANATIVE_MODE=${{ matrix.build-mode }}&
          set SCALANATIVE_LTO=${{ matrix.lto }}&
          set SCALANATIVE_TEST_PREFETCH_DEBUG_INFO=1&
          set SCALANATIVE_CI_NO_DEBUG_SYMBOLS=true&
          set SCALANATIVE &
          sbt "test-runtime-native ${{ matrix.scala }}"
        shell: cmd

  llvm-versions:
    name: LLVM ${{ matrix.llvm }}
    if: inputs.nightly
    runs-on: windows-2022
    # LLVM 21.1.8 crashes in clang codegen on Windows; keep for visibility.
    continue-on-error: ${{ matrix.llvm == '21.1.8' }}
    strategy:
      fail-fast: false
      matrix:
        # Default jobs use the preinstalled LLVM 20. Each version needs a
        # SHA-256 entry in scripts/ci/windows/install-llvm.ps1.
        llvm: ["19.1.7", "21.1.8", "22.1.8", "23.1.3"]
    steps:
      - name: Setup git config
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: ./.github/actions/windows-setup-env
        with:
          scala-version: "3"
          llvm-version: ${{ matrix.llvm }}
      - uses: ./.github/actions/restore-build-outputs
        with:
          scala-version: "3"
      - name: Run tests
        shell: cmd
        timeout-minutes: 60
        run: >
          set SCALANATIVE &
          sbt "show tests3/nativeConfig" "test-runtime-native 3"

  # Scala 3 tests the sbt 2.x plugin
  scripted:
    name: Scripted (${{ matrix.scala }})
    if: inputs.sbt-plugin
    runs-on: windows-2022
    strategy:
      matrix:
        scala: ["3"]
    steps: &scripted-steps
      # Disable autocrlf setting, otherwise scalalib patches might not be possible to apply
      - name: Setup git config
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: ./.github/actions/windows-setup-env
        with:
          scala-version: ${{ matrix.scala }}
      - name: Test scripted
        timeout-minutes: 120
        # Run in the foreground without the boot server's Windows named pipe.
        run: sbt --server -Dsbt.server.autostart=false "test-scripted ${{ matrix.scala }}"
        shell: cmd

  # Scala 2.12 tests the sbt 1.x plugin
  scripted-sbt1:
    name: Scripted (${{ matrix.scala }})
    if: inputs.nightly
    runs-on: windows-2022
    strategy:
      matrix:
        scala: ["2.12"]
    steps: *scripted-steps
